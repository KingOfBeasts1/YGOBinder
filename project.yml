name: YGOBinder
options:
  bundleIdPrefix: com.ygobinder
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  YGOBinder:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: YGO Binder
        NSCameraUsageDescription: Scan your Yu-Gi-Oh cards to add them to your collection.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ygobinder.app
        TARGETED_DEVICE_FAMILY: "1"
